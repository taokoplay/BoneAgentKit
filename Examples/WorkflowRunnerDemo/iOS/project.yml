name: BoneAgentLab
options:
  bundleIdPrefix: com.taokoplay
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
packages:
  BoneAgentKit:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '19'
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BoneAgentLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../Sources/WorkflowRunnerDemo
        excludes:
          - DemoMain.swift
      - path: Assets.xcassets
    dependencies:
      - package: BoneAgentKit
        product: BoneAgentKit
      - package: BoneAgentKit
        product: BoneAgentTesting
      - package: BoneAgentKit
        product: BoneAgentLocalModels
      - package: BoneAgentKit
        product: BoneAgentTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taokoplay.BoneAgentLab
        CODE_SIGN_ENTITLEMENTS: App/BoneAgentLab.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Agent Lab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: '允许 Agent Lab 查询和管理你的日历事件。'
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: '允许 Agent Lab 创建和修改你的日历事件。'
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: '允许 Agent Lab 查询和管理你的提醒事项。'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: '允许 Agent Lab 将已确认的图片保存到相册。'
        INFOPLIST_KEY_NSContactsUsageDescription: '允许 Agent Lab 在确认后查询和管理你的联系人。'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: '允许 Agent Lab 在你请求时查询当前位置并提供相关结果。'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  BoneAgentLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BoneAgentLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taokoplay.BoneAgentLabUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BoneAgentLab:
    build:
      targets:
        BoneAgentLab: all
        BoneAgentLabUITests: [test]
    test:
      targets:
        - BoneAgentLabUITests
